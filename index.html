<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "DM Sans"; font-weight: 400; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-weight: 500; src: url("assets/fonts/dm-sans-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-weight: 700; src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-weight: 800; src: url("assets/fonts/dm-sans-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-weight: 900; src: url("assets/fonts/dm-sans-latin-900-normal.woff2") format("woff2"); }
      :root {
        --ground: #f9f5ef;
        --ink: #00454d;
        --body: #666873;
        --accent: #367cb3;
        --line: #3f484a;
        --font-display: "DM Sans", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.8" data-width="1920" data-height="1080">
      <div
        id="welcome"
        data-composition-id="welcome"
        data-composition-src="compositions/welcome.html"
        data-start="0"
        data-duration="8.8"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Voiceover (HeyGen Cassidy), section 1 -->
      <audio id="vo-s1" class="clip" src="assets/voice/s1.mp3" data-start="0.3" data-track-index="1" data-volume="1"></audio>

      <!-- Sound effects: character pops and the tutor reveal -->
      <audio id="sfx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="1.85" data-duration="0.7" data-track-index="2" data-volume="0.35"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="2.10" data-duration="0.7" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-pop3" class="clip" src="assets/sfx/pop.mp3" data-start="2.36" data-duration="0.7" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-pop4" class="clip" src="assets/sfx/pop.mp3" data-start="2.59" data-duration="0.7" data-track-index="2" data-volume="0.3"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="6.25" data-duration="1.8" data-track-index="2" data-volume="0.3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
