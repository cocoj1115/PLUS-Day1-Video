    const tl = gsap.timeline({ paused: true });
    // initial states, applied before frame 0 (the tweens below revert to them when seeking back)
    const S = (t, v) => gsap.set(t, v);
    const OUT = "power4.out";
    const DUR = 7.403;

    S("#w-tutor", { opacity: 0, scale: 0.6 });
    S("#w-bubble", { opacity: 0, scale: 0.5 });
    S("#w-title", { y: 0, scale: 1 });
    S("#w-stage", { x: 0 });

    // "We're excited to meet you" — mascots pop up from behind the hill and wave once

      tl.to(sel, { y: 0, duration: 0.5, ease: "back.out(1.5)" }, t);
      tl.to(sel, { rotation: -7, duration: 0.18, ease: "power2.out" }, t + 0.45);
      tl.to(sel, { rotation: 4, duration: 0.2, ease: "power2.inOut" }, t + 0.63);
      tl.to(sel, { rotation: 0, duration: 0.25, ease: "power2.out" }, t + 0.83);
