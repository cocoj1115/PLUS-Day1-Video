  <style>

    .e-char { position: absolute; transform-origin: 50% 100%; }
    #e-pink { left: 70px; top: 796px; width: 230px; }
    #e-tut { left: 1640px; bottom: 120px; width: 220px; }
    #e-greater { left: 60px; bottom: 120px; width: 200px; }
    #e-flower { left: 640px; bottom: 120px; width: 150px; }

  <div id="root" data-composition-id="outro" data-width="1920" data-height="1080">
    <div id="e-stage" data-layout-allow-overflow>

      <img id="e-greater" class="e-char" data-layout-allow-overflow src="assets/brand/char-greater.png" alt="" />
      <img id="e-wave" class="e-char" data-layout-allow-overflow src="assets/brand/char-wave.png" alt="" />

  <script>
    // Scene seconds = voiceover word time (assets/voice/vo_meta.json, s8).
    const tl = gsap.timeline({ paused: true });
    // initial states, applied before frame 0 (the tweens below revert to them when seeking back)
    const S = (t, v) => gsap.set(t, v);
    const OUT = "power4.out";

    S("#e-stage", { x: 700 });
    S(".e-stone", { opacity: 0, scale: 0.4 });
    S("#e-pink", { x: 0, y: 0 });
    S("#e-tut", { y: 340 });
    S(["#e-greater", "#e-wave", "#e-divide"], { y: 340 });
    S(["#e-flag", "#e-flag-label"], { opacity: 0, scale: 0.4 });
    S(["#e-w1", "#e-w2", "#e-w3"], { opacity: 0, filter: "blur(8px)" });
    S("#e-hl", { scaleX: 0 });
    S("#e-logo", { opacity: 0, y: 20 });

    tl.to("#e-stage", { x: 0, duration: 0.55, ease: "power3.out" }, 0);

    // one stone per phrase; the student hops onto each one
    const hop = (x, y, t) => {
      tl.to("#e-pink", { x, duration: 0.5, ease: "power2.inOut" }, t);
      tl.to("#e-pink", { y: y - 90, duration: 0.25, ease: "power2.out" }, t);
      tl.to("#e-pink", { y, duration: 0.25, ease: "power2.in" }, t + 0.25);
    };
    // "Keep practicing"
    tl.to("#e-st1", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 0.55);
    hop(235, -120, 0.95);
    // "ask questions"
    tl.to("#e-st2", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 1.55);
    hop(685, -180, 1.95);
    // "take it one step at a time"
    tl.to("#e-st3", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 3.2);
    hop(1075, -240, 3.65);

    // "Your tutor is here to help you reach your goals"
    tl.to("#e-tut", { y: 0, duration: 0.5, ease: "back.out(1.5)" }, 4.85);
    tl.to(["#e-flag", "#e-flag-label"], { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 6.1);

    // "You've got this!"
    tl.to("#e-w1", { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: OUT }, 6.87);
    tl.to("#e-w2", { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: OUT }, 7.08);
    tl.to("#e-w3", { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: OUT }, 7.3);
    tl.to("#e-hl", { scaleX: 1, duration: 0.38, ease: "power2.inOut" }, 7.2);
    tl.to(["#e-greater", "#e-wave", "#e-divide"], { y: 0, duration: 0.5, ease: "back.out(1.5)", stagger: 0.08 }, 6.95);
    // everyone cheers once
    const crowd = ["#e-greater", "#e-wave", "#e-divide", "#e-tut"];
    tl.to(crowd, { y: -45, duration: 0.25, ease: "power2.out", stagger: 0.06 }, 7.7);
    tl.to(crowd, { y: 0, duration: 0.3, ease: "power2.in", stagger: 0.06 }, 7.95);
    tl.to("#e-pink", { y: -300, duration: 0.25, ease: "power2.out" }, 7.7);
    tl.to("#e-pink", { y: -240, duration: 0.3, ease: "power2.in" }, 7.95);
    tl.to("#e-logo", { opacity: 1, y: 0, duration: 0.4, ease: OUT }, 7.9);

    window.__timelines["outro"] = tl;
  </script>
