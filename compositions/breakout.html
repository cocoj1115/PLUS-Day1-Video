  <script>
    // Scene seconds = voiceover word time (assets/voice/vo_meta.json, s4).
    const tl = gsap.timeline({ paused: true });
    // initial states, applied before frame 0 (the tweens below revert to them when seeking back)
    const S = (t, v) => gsap.set(t, v);
    const OUT = "power4.out";
    const DUR = 19.288;
    // a walk: one smooth move along x with a small step bob
    const walk = (sel, x, t, d, steps) => {
      tl.to(sel, { x, duration: d, ease: "sine.inOut" }, t);
      tl.to(sel, { y: -14, duration: d / (steps * 2), ease: "sine.out", yoyo: true, repeat: steps * 2 - 1 }, t);
    };

    S("#b-stage", { x: 0, scale: 1, opacity: 1 });
    S("#b-main", { opacity: 1, scale: 1 });
    S("#b-hole", { opacity: 1 });
    S("#b-main-label", { opacity: 1 });
    S("#b-room", { opacity: 0, scale: 0.7, borderColor: "#00454d" });
    S("#b-empty", { opacity: 0, borderColor: "#90c9f4" });
    S(".b-dot", { opacity: 0 });
    S("#b-me > img", { rotation: 0, y: 0, scale: 1 });
    // "You" lifts out of the grid's centre cell (x 760, y 437, 400×227); its home slot in the room is x 500, y 290
    S("#b-me", { x: 308, y: 147, scale: 0.688, opacity: 0 });
    S("#b-paper", { y: 190 });
    S(["#b-w1", "#b-w2"], { clipPath: "inset(0 100% 0 0)" });
    S("#b-sticker", { opacity: 0, scale: 1.5, rotation: -8 });
    S("#b-roomgrp", { x: 0, y: 0, scale: 1 });
    S(".b-mini", { opacity: 0, scale: 0.22, borderColor: "#00454d" });
    S(".b-tv", { opacity: 0, x: 260 });
    S("#b-path", { clipPath: "inset(0 100% 0 0)", opacity: 1 });
    S("#b-guide", { opacity: 0, x: 0, y: 0 });
    S("#b-walker", { opacity: 0, x: 520, y: 0 });

    // "your tutor will move you into your own breakout room" — your cell lifts out of the grid
    tl.to("#b-main-label", { opacity: 0, duration: 0.25 }, 1.55);
    tl.to("#b-me", { opacity: 1, duration: 0.12 }, 1.6);
    tl.to("#b-hole", { opacity: 0, duration: 0.12 }, 1.62);
    tl.to("#b-me", { scale: 0.74, x: 298, y: 132, duration: 0.3, ease: "power2.out" }, 1.6);
    tl.to("#b-main", { opacity: 0, scale: 0.94, duration: 0.45, ease: "power2.in" }, 2.0);
    tl.to("#b-room", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 2.6);
    tl.to("#b-me", { x: 0, y: 0, scale: 1, duration: 0.6, ease: "power3.inOut" }, 2.7);

    // "just for you" — your tile gives a small hop
    tl.to("#b-me > img", { y: -26, duration: 0.2, ease: "power2.out" }, 5.15);
    tl.to("#b-me > img", { y: 0, duration: 0.25, ease: "power2.in" }, 5.35);
    // "You might only see yourself at first" — an empty slot beside you
    tl.to("#b-empty", { opacity: 1, duration: 0.3 }, 6.1);
    tl.to(".b-dot", { opacity: 1, duration: 0.15, stagger: 0.3 }, 6.3);
    tl.to("#b-me > img", { rotation: -8, duration: 0.3, ease: "power2.inOut" }, 6.7);
    tl.to("#b-me > img", { rotation: 6, duration: 0.35, ease: "power2.inOut" }, 7.05);
    tl.to("#b-me > img", { rotation: 0, duration: 0.3, ease: "power2.out" }, 7.45);
    // "That's okay! You're in the right place."
    tl.to("#b-sticker", { opacity: 1, scale: 1, rotation: -3, duration: 0.35, ease: "back.out(1.8)" }, 8.2);

    // "Your tutor helps a few students and visits their rooms one at a time" — pull back to the map
    tl.to("#b-sticker", { opacity: 0, duration: 0.25 }, 10.0);
    tl.to("#b-roomgrp", { x: 540, y: 30, scale: 0.36, duration: 0.9, ease: "power2.inOut" }, 10.0);
    tl.to(".b-mini", { opacity: 1, scale: 0.36, duration: 0.4, ease: "back.out(1.6)", stagger: 0.12 }, 10.9);
    tl.to("#b-path", { clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "power2.inOut" }, 11.45);
    tl.to("#b-guide", { opacity: 1, duration: 0.25 }, 11.75);
    // visit room 1: the tutor's video tile slides into that room's empty slot, then leaves
    tl.to("#b-r1", { borderColor: "#367cb3", duration: 0.2 }, 11.95);
    tl.to("#b-r1 .b-tv", { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 11.95);
    tl.to("#b-r1 .b-tv", { opacity: 0, x: 260, duration: 0.3, ease: "power3.in" }, 12.5);
    tl.to("#b-r1", { borderColor: "#00454d", duration: 0.25 }, 12.65);
    // walk on to room 2 ("one at a time")
    walk("#b-guide", 440, 12.55, 0.85, 2);
    tl.to("#b-r2", { borderColor: "#367cb3", duration: 0.2 }, 13.4);
    tl.to("#b-r2 .b-tv", { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 13.4);

    // "Stay in your room and start your math work" — the camera returns to your room

    tl.to("#b-roomgrp", { x: 0, y: 0, scale: 1, duration: 0.9, ease: "power2.inOut" }, 14.1);
    tl.to("#b-me > img", { scale: 0.58, transformOrigin: "50% 0%", duration: 0.45, ease: "power2.inOut" }, 14.95);
    tl.to("#b-paper", { y: 0, duration: 0.45, ease: "power3.out" }, 15.0);
    tl.to("#b-w1", { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "none" }, 15.45);
    tl.to("#b-w2", { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "none" }, 16.0);

    // "Your tutor will come to you" — the tutor walks over to your room
    tl.to("#b-walker", { opacity: 1, duration: 0.2 }, 17.2);
    walk("#b-walker", 0, 17.2, 1.2, 3);
    tl.to("#b-empty", { borderColor: "#367cb3", duration: 0.25 }, 18.35);

    // exit: travel left with the camera
    tl.to("#b-stage", { x: -700, duration: 0.4, ease: "power3.in" }, DUR - 0.42);

    window.__timelines["breakout"] = tl;
  </script>
